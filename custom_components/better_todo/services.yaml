set_task_recurrence:
  target:
    entity:
      integration: better_todo
      domain: todo
  fields:
    item:
      required: true
      example: "abc123-uid"
      selector:
        text:
    rrule:
      required: false
      example: "FREQ=WEEKLY;BYDAY=MO"
      selector:
        text:

set_task_details:
  target:
    entity:
      integration: better_todo
      domain: todo
  fields:
    item:
      required: true
      example: "abc123-uid"
      selector:
        text:
    quantity:
      required: false
      example: "2 kg"
      selector:
        text:
    unit:
      required: false
      example: "kg"
      selector:
        text:
    category:
      required: false
      example: "Meat"
      selector:
        text:
    notes:
      required: false
      example: "Pick up at the butcher"
      selector:
        text:
          multiline: true

set_task_assignee:
  target:
    entity:
      integration: better_todo
      domain: todo
  fields:
    item:
      required: true
      selector:
        text:
    user_id:
      selector:
        text:

add_assigned_task:
  target:
    entity:
      integration: better_todo
      domain: todo
  fields:
    summary:
      required: true
      selector:
        text:
    user_id:
      required: true
      selector:
        text:
    description:
      selector:
        text:
          multiline: true
    due_date:
      selector:
        date:
    due_datetime:
      selector:
        datetime:
    rrule:
      selector:
        text:
