[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "better_todo"
version = "0.6.0"
description = "Better To-do – Home Assistant custom integration"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "ical==13.2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]
